services:
  moodle_escola_modelo:
    image: w3soft/moodle:2026.07.1-local
    container_name: moodle_escola_modelo
    restart: unless-stopped
    env_file:
      - ./secrets/escola-modelo.local.env
    volumes:
      - moodledata_escola_modelo:/var/www/moodledata
    networks:
      - moodle_net
    cpus: "1.0"
    mem_limit: 1.5g
    mem_reservation: 512m
volumes:
  moodledata_escola_modelo:
    name: moodledata_escola_modelo
networks:
  moodle_net:
    external: true
